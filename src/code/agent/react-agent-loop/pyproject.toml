[project]
name = "react-agent-loop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "mcp>=1.0,<2",
    "openai>=2.0,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
